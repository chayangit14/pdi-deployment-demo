# DEV deploy — only after a PR is merged into main.
# A raw `git push` to main does NOT trigger this (that used to skip review).
# Still protect `main` in GitHub: require a PR + this "PR Check" status.
name: Deploy Dev
on:
  pull_request:
    types: [closed]
    branches: [main]
jobs:
  deploy-dev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx now-sdk build --frozenKeys
      - name: Install on Dev
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_INSTANCE_URL: ${{ secrets.SN_DEV_URL }}
          SN_SDK_USER: ${{ secrets.SN_DEV_USER }}
          SN_SDK_USER_PWD: ${{ secrets.SN_DEV_PASSWORD }}
        run: npx now-sdk install
