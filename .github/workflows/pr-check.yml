# Quality gate only — never deploys.
# Runs when you OPEN/UPDATE a PR whose target (base) is main or release/*.
# Combine this with branch protection: "Require status checks to pass before merging"
# so a failing build cannot be merged.
name: PR Check
on:
  pull_request:
    branches: [main, "release/*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx now-sdk build --frozenKeys
